<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inky 现有页面检查记录</title><style>body{margin:0;background:#f2efe7;color:#30332f;font:15px/1.75 "Microsoft YaHei UI",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px}h1{font-size:28px;margin:0 0 12px}p{max-width:850px}a{color:#4d6170}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px;margin-top:28px}figure{margin:0;padding:16px;background:#faf8f2;border:1px solid #dcded4;border-radius:8px}img{width:100%;height:380px;object-fit:contain;background:white}h2{font-size:17px;margin:12px 0 6px}figcaption p{margin:0;color:#686c63;font-size:14px}.limit{padding:16px;border-left:3px solid #52634f}</style><main><h1>Inky 现有页面检查记录</h1><p>2026-09-07 · 当前工作区浏览器 DEMO · <a href="../../specs/2026-09-07-inky-paper-ui-upgrade.md">阅读 UI 升级方案</a></p><p class="limit">这是现有版本的页面证据，不是新版设计稿。本轮已浏览主要前端页面，未验证真实桌面保存、快捷键、Agent 联通或模型返回。新版方向已明确：简洁纸页、手绘陪伴、移除宠物等级和 XP。</p><div class="grid"><figure><a href="01-onboarding.png"><img src="01-onboarding.png" alt="01 · 首次命名，当前版本截图"></a><figcaption><h2>01 · 首次命名</h2><p>可跳过，但命名弹窗挡住第一次记录。新版首屏直接进入任务输入。</p></figcaption></figure><figure><a href="02-tasks.png"><img src="02-tasks.png" alt="02 · 任务主页，当前版本截图"></a><figcaption><h2>02 · 任务主页</h2><p>任务、编辑、拆解和专注入口完整。等级、经验条、心情及底栏挤占主要空间；新版移除成长系统。</p></figcaption></figure><figure><a href="03-inbox.png"><img src="03-inbox.png" alt="03 · 随手记空态，当前版本截图"></a><figcaption><h2>03 · 随手记空态</h2><p>可切换记录模式；空态缺少用途说明。建议使用明确页签与一句操作提示。</p></figcaption></figure><figure><a href="04-task-edit.png"><img src="04-task-edit.png" alt="04 · 编辑任务，当前版本截图"></a><figcaption><h2>04 · 编辑任务</h2><p>字段与保存动作明确。统一纸页容器与间距，保留手动修改。</p></figcaption></figure><figure><a href="05-breakdown.png"><img src="05-breakdown.png" alt="05 · 步骤整理，当前版本截图"></a><figcaption><h2>05 · 步骤整理</h2><p>先收集用户计划，边界明确。提示和按钮偏小，手动编辑路径应更直白。</p></figcaption></figure><figure><a href="06-focus.png"><img src="06-focus.png" alt="06 · 专注模式，当前版本截图"></a><figcaption><h2>06 · 专注模式</h2><p>已观察到计时。240×136 的掌机外壳压缩内容；建议改为任务、时间、暂停为主的纸条。</p></figcaption></figure><figure><a href="07-paused.png"><img src="07-paused.png" alt="07 · 暂停恢复，当前版本截图"></a><figcaption><h2>07 · 暂停恢复</h2><p>有剩余时间与继续入口，是应该保留并突出显示的能力。</p></figcaption></figure><figure><a href="08-history.png"><img src="08-history.png" alt="08 · 专注记录，当前版本截图"></a><figcaption><h2>08 · 专注记录</h2><p>能看到本次暂停的 DEMO 会话。保留真实工作记录，收起首页重复统计。</p></figcaption></figure><figure><a href="09-settings.png"><img src="09-settings.png" alt="09 · 设置上部，当前版本截图"></a><figcaption><h2>09 · 设置上部</h2><p>协作、外观、专注混排。建议按目的分组，角色设置不再含成长体系。</p></figcaption></figure><figure><a href="10-settings-ai.png"><img src="10-settings-ai.png" alt="10 · 设置下部，当前版本截图"></a><figcaption><h2>10 · 设置下部</h2><p>AI 配置、本地数据、窗口和关于需要滚动查看；技术说明留在设置中。</p></figcaption></figure><figure><a href="11-mini.png"><img src="11-mini.png" alt="11 · 迷你模式，当前版本截图"></a><figcaption><h2>11 · 迷你模式</h2><p>占用空间小，保留轻量陪伴方向。截图不能验证原生拖动和托盘行为。</p></figcaption></figure></div><p>AI 返回页、计时自然结束、真实保存错误和同步冲突没有在本轮触发；方案中的相关结论来自当前代码核对。截图无法证明完整无障碍合规性。点击每张图片可查看原始截图。</p></main></html>
